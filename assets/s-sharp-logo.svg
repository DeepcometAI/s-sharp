<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGradient" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#3A6FE0"/>
      <stop offset="55%" stop-color="#1E3FBF"/>
      <stop offset="100%" stop-color="#0A1856"/>
    </linearGradient>
  </defs>

  <!-- Hexagon with rounded corners, matching C# logo proportions -->
  <path d="
    M 100 6
    L 176 48
    Q 184 52.5 184 61.5
    L 184 138.5
    Q 184 147.5 176 152
    L 100 194
    Q 92 198.5 84 194
    L 8 152
    Q 0 147.5 0 138.5
    L 0 61.5
    Q 0 52.5 8 48
    L 84 6
    Q 92 1.5 100 6
    Z"
    fill="url(#bgGradient)"
  />

  <!-- "S" letterform, blocky/geometric to match C#'s bold sans style -->
  <path d="
    M 62 68
    Q 44 68 44 84
    Q 44 96 58 99
    L 70 101.5
    Q 76 103 76 108
    Q 76 113 68 113
    L 50 113
    Q 44 113 44 119
    Q 44 125 50 125
    L 70 125
    Q 88 125 88 108
    Q 88 96 74 93
    L 62 90.5
    Q 56 89 56 84
    Q 56 80 62 80
    L 78 80
    Q 84 80 84 74
    Q 84 68 78 68
    Z"
    fill="#FFFFFF"
  />

  <!-- "#" sharp sign: vertical strokes, softer weight, more breathing room from the S -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
    <line x1="114" y1="70" x2="114" y2="126"/>
    <line x1="136" y1="70" x2="136" y2="126"/>
    <line x1="100" y1="90" x2="150" y2="90"/>
    <line x1="100" y1="108" x2="150" y2="108"/>
  </g>
</svg>
